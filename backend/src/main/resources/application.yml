spring:
    profiles:
        include: secret
    datasource:
        meta: # 배치 메타데이터용 DB (ssafyforce_batch)
            jdbc-url: jdbc:mysql://localhost:3306/ssafyforce_batch?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul
            username: ssafy
            password: ssafy
            driver-class-name: com.mysql.cj.jdbc.Driver
        data: # 비즈니스 로직용 DB (ssafyforce)
            jdbc-url: jdbc:mysql://localhost:3306/ssafyforce?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&serverTimezone=Asia/Seoul
            username: ssafy
            password: ssafy
            driver-class-name: com.mysql.cj.jdbc.Driver

    batch:
        job:
            enabled: false
        jdbc:
            initialize-schema: always
    task:
        scheduling:
            pool:
                size: 2  # 스케줄링 스레드 풀 크기
            thread-name-prefix: "batch-scheduler-"
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQL8Dialect
        properties:
            hibernate:
                default_batch_fetch_size: 1000

    logging:
        level:
            org.hibernate.SQL: debug
            org.hibernate.type: trace
            com.baekjoon.team: debug
            force.ssafy.global.security: DEBUG
            org.springframework.security: DEBUG

    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB


jwt:
    secret: backjoonTeamCompetitionApplicationSecretKey2023!@#$
    token:
        access-expiration-time: 3600000  # 1시간
        refresh-expiration-time: 1209600000  # 14일


file:
    upload:
        directory: /path/to/upload/directory  # 실제 서버의 업로드 경로로 수정
