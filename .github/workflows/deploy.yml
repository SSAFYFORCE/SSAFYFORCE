name: Deploy Spring Boot Application

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Create application.yml
      working-directory: ./backend/src/main/resources
      run: |
        echo "${{ secrets.APPLICATION_PROD_YML }}" > application.yml
    
    - name: Grant execute permission for gradlew
      run: chmod +x backend/gradlew
    
    - name: Build with Gradle
      working-directory: ./backend
      run: ./gradlew build -x test
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/ssafy-force:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /home/ubuntu/backend
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ssafy-force:latest
          docker stop ssafy-force || true
          docker rm ssafy-force || true
          docker run -d --name ssafy-force -p 8080:8080 -e SPRING_PROFILES_ACTIVE=prod ${{ secrets.DOCKERHUB_USERNAME }}/ssafy-force:latest
